name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The scenario or exercise you're running, and what's missing or awkward.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
